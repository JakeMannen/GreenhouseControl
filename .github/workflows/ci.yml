name: CI Build Check

on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'src/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/build-and-release.yml'

jobs:
  build-check:
    name: Build Firmware (ESP32-C6)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          target: esp32c6
          path: 'src'
          esp_idf_version: latest
