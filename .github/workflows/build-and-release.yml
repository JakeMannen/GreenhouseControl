name: Build and Release OTA Firmware

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'src/**'
      - '.github/workflows/**'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create releases
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Semantic Version
        id: semver
        uses: paulhatch/semantic-version@v6.0.2
        with:
          tag_prefix: "v"
          major_pattern: "(MAJOR)"
          minor_pattern: "(MINOR)"
          version_format: ${{ github.ref == 'refs/heads/main' && '${major}.${minor}.${patch}' || '${major}.${minor}.${patch}-prerelease.${increment}' }}

      - name: Convert Version to Zigbee Format
        id: hexver
        run: |
          MAJOR=${{ steps.semver.outputs.major }}
          MINOR=${{ steps.semver.outputs.minor }}
          PATCH=${{ steps.semver.outputs.patch }}
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            BUILD=0
          else
            BUILD=${{ steps.semver.outputs.increment }}
          fi
          # Zigbee File Version Format (4 bytes):
          # Byte 3 (App Version): Major
          # Byte 2 (App Build):   Build / Increment
          # Byte 1 (Stack Ver):   Minor
          # Byte 0 (Stack Build): Patch
          HEX_VER=$(printf "0x%02x%02x%02x%02x" $MAJOR $BUILD $MINOR $PATCH)
          echo "OTA_FILE_VERSION=$HEX_VER" >> $GITHUB_ENV
          echo "APP_VERSION=${{ steps.semver.outputs.version }}" >> $GITHUB_ENV
          echo "Semantic version converted to $HEX_VER"

      - name: Build Firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          target: esp32c6
          path: 'src'
          esp_idf_version: latest
          extra_docker_args: "-e OTA_FILE_VERSION=${{ env.OTA_FILE_VERSION }} -e APP_VERSION=${{ env.APP_VERSION }}"

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v7
        with:
          name: greenhouse-firmware-v${{ steps.semver.outputs.version }}
          path: |
            src/build/greenhouse_controller.bin
            src/build/*.ota

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.semver.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          files: src/build/*.ota
